<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="Az7e5vXuiHngtDKLLUG4GH">
<head data-page-node-id="H2D6BKPYXHfMioaTIwaHVZ">
<meta charset="UTF-8" data-page-node-id="yTlZle8iWY3ItiMeliOprF">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" data-page-node-id="iASDZ6S60RjAMxrTwyEDYU">
<title>EMMA 英语乐园</title>
<style>
:root{
  --y1:#FFC42E; --y2:#FFD964; --ydeep:#EFA800; --ytext:#6B4A00;
  --bg:#FFF7E6; --card:#FFFFFF; --ink:#3A2E1A; --muted:#9C8E74;
  --blue:#5E9BFF; --blueBg:#E7F0FF; --orange:#FF9F2E; --orangeBg:#FFEEDA;
  --green:#4CC36A; --greenBg:#E5F8E9; --pink:#FF7EB0; --pinkBg:#FFE9F2;
  --purple:#9B7BFF; --purpleBg:#F0E9FF;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  color:var(--ink);
  background:linear-gradient(180deg,#FFB800 0,#FFCE4A 200px,#FFE9AE 380px,var(--bg) 520px);
  background-attachment:fixed;
  min-height:100vh;
  display:flex;flex-direction:column;
}
#page{flex:1;overflow-y:auto;padding:0 14px 96px;width:100%;max-width:520px;margin:0 auto}
h1{font-size:22px}
.muted{color:var(--muted);font-size:13px}

/* ---------- top header ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 4px 10px}
.topbar .ttl{display:flex;align-items:center;gap:8px;font-size:24px;font-weight:900}
.topbar .mascot{font-size:30px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.15))}
.topbar .right{font-size:14px;font-weight:700;color:var(--ytext);background:rgba(255,255,255,.55);padding:6px 12px;border-radius:20px;cursor:pointer}

/* ---------- cards ---------- */
.card{background:var(--card);border-radius:20px;box-shadow:0 6px 18px rgba(180,130,20,.10);padding:16px;margin-bottom:14px}
.secT{display:flex;align-items:center;justify-content:space-between;margin:16px 2px 10px}
.secT b{font-size:17px}
.secT .bar{display:inline-block;width:5px;height:16px;background:var(--y1);border-radius:3px;margin-right:6px;vertical-align:-2px}
.secT .more{font-size:13px;color:var(--muted);cursor:pointer}

/* ---------- textbook card ---------- */
.bookCard{display:flex;gap:14px;align-items:flex-start}
.cover{width:84px;height:112px;border-radius:8px;flex:none;position:relative;overflow:hidden;
  background:linear-gradient(150deg,#79D0E8 0%,#3FA9C9 55%,#2B7FA8 100%);
  box-shadow:2px 3px 8px rgba(0,60,90,.25);color:#fff}
.cover::after{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:rgba(255,255,255,.25)}
.cover .cb1{position:absolute;top:8px;left:12px;font-size:9px;letter-spacing:1px;opacity:.9}
.cover .cb2{position:absolute;top:20px;left:12px;font-size:26px;font-weight:900;text-shadow:0 1px 3px rgba(0,0,0,.3)}
.cover .cb3{position:absolute;top:50px;left:12px;font-size:8px;letter-spacing:2px}
.cover .cb4{position:absolute;bottom:10px;left:12px;font-size:10px;font-weight:700;background:rgba(255,255,255,.9);color:#1B6E93;padding:2px 6px;border-radius:4px}
.cover .cbig{position:absolute;right:-6px;bottom:22px;font-size:52px;font-weight:900;color:rgba(255,255,255,.35)}
.bookInfo{flex:1;min-width:0}
.chip{display:inline-block;background:linear-gradient(180deg,#FFD54F,#FFB300);color:#6B4A00;font-size:12px;font-weight:800;padding:5px 12px;border-radius:16px;box-shadow:0 2px 0 #E09600;cursor:pointer}
.bookName{font-size:19px;font-weight:900;margin:8px 0 2px}
.bookSub{font-size:12px;color:var(--muted)}
.pbarWrap{height:8px;background:#F2E8CF;border-radius:5px;margin:12px 0 6px;overflow:hidden}
.pbar{height:100%;background:linear-gradient(90deg,#FFD54F,#FFB300);border-radius:5px;transition:width .4s}
.bookStat{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.bookStat b{color:var(--ink)}

/* ---------- plan today ---------- */
.todayGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.todayCard{border-radius:18px;padding:16px 14px 14px;color:#fff;position:relative;overflow:hidden}
.todayCard .bigIco{position:absolute;top:10px;left:12px;font-size:26px;opacity:.9}
.todayCard .cnt{text-align:center;font-size:26px;font-weight:900;margin:14px 0 12px;text-shadow:0 1px 2px rgba(0,0,0,.15)}
.todayCard .cnt small{font-size:14px;opacity:.85}
.tBlue{background:linear-gradient(160deg,#7FB3FF,#4A86F0)}
.tOrange{background:linear-gradient(160deg,#FFB84D,#FF9013)}
.todayBtn{display:block;width:100%;border:none;border-radius:12px;padding:9px 0;font-size:16px;font-weight:900;cursor:pointer;background:rgba(255,255,255,.92)}
.tBlue .todayBtn{color:#2F6BD8;box-shadow:0 3px 0 #D3E2F8}
.tOrange .todayBtn{color:#E67E00;box-shadow:0 3px 0 #F5DCB8}
.todayBtn:active{transform:translateY(2px);box-shadow:none}

/* ---------- day list ---------- */
.dayRow{display:flex;align-items:center;gap:10px;background:#FDFBF4;border:1.5px solid #F1E9D2;border-radius:14px;padding:12px 14px;margin-bottom:8px}
.dayRow.done{background:var(--greenBg);border-color:#BFE8C9}
.badge{flex:none;font-size:12px;font-weight:800;padding:4px 9px;border-radius:8px}
.bDone{color:#2E9E4F;background:#D4F0DB;border:1.5px dashed #7CCB93}
.bDoing{color:#fff;background:var(--orange)}
.bTodo{color:#B9AE95;background:#F0EAD6}
.dayRow .dname{font-weight:900;font-size:15px;width:58px}
.dayRow .dinfo{flex:1;display:flex;justify-content:space-around;font-size:14px;color:var(--muted)}
.dayRow .dinfo b{color:var(--ink);font-size:16px}

/* ---------- chunky button ---------- */
.btn3d{display:block;width:100%;border:none;cursor:pointer;text-align:center;
  background:linear-gradient(180deg,#FFD54F,#FFB300);color:#5A3A00;
  font-size:17px;font-weight:900;padding:14px 0;border-radius:16px;
  box-shadow:0 4px 0 #E09600,0 8px 16px rgba(224,150,0,.25)}
.btn3d:active{transform:translateY(3px);box-shadow:0 1px 0 #E09600}
.btn2{display:inline-block;border:none;cursor:pointer;background:#FFF3D1;color:#A8740A;font-weight:800;font-size:14px;padding:9px 18px;border-radius:12px;box-shadow:0 2px 0 #EAD9A8}
.btn2:active{transform:translateY(2px);box-shadow:none}

/* ---------- pastel tiles ---------- */
.tileGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border-radius:18px;padding:16px 14px;cursor:pointer;position:relative;overflow:hidden;min-height:86px}
.tile .tt{font-size:17px;font-weight:900;margin-bottom:4px}
.tile .ts{font-size:12px;color:#7A6F5C}
.tile .ico{position:absolute;right:10px;bottom:8px;font-size:34px;opacity:.85}
.tile.full{grid-column:1/3}
.tileB{background:var(--blueBg)} .tileG{background:var(--greenBg)} .tileP{background:var(--pinkBg)}
.tileO{background:var(--orangeBg)} .tileV{background:var(--purpleBg)}

/* ---------- stat row ---------- */
.statRow{display:flex;text-align:center;margin:6px 0 14px}
.statRow>div{flex:1}
.statRow .n{font-size:26px;font-weight:900}
.statRow .l{font-size:12px;color:var(--muted);margin-top:2px}
.dotG{color:var(--green)} .dotO{color:var(--orange)}

/* ---------- search ---------- */
.searchBar{display:flex;align-items:center;gap:8px;background:#fff;border-radius:22px;padding:11px 16px;box-shadow:0 4px 12px rgba(180,130,20,.12);margin-bottom:14px}
.searchBar input{border:none;outline:none;flex:1;font-size:15px;background:transparent}
.searchBar .sIco{color:var(--ydeep);font-size:18px}
.wRow{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid #F4EDD9;cursor:pointer}
.wRow:last-child{border-bottom:none}
.wRow .ww{font-weight:800;font-size:16px}
.wRow .wp{font-size:12px;color:var(--muted)}
.wRow .wz{margin-left:auto;font-size:13px;color:#6E6350;text-align:right}

/* ---------- pet ---------- */
.petCard{text-align:center;position:relative}
.lvChip{position:absolute;top:14px;left:14px;background:linear-gradient(180deg,#FFD54F,#FFB300);border-radius:14px;padding:6px 12px;font-weight:900;color:#5A3A00;box-shadow:0 2px 0 #E09600;z-index:2}
.xpLine{display:flex;align-items:center;gap:10px;margin:6px 30px 0 96px;font-size:13px;font-weight:700;color:var(--ytext)}
.xpBar{flex:1;height:8px;background:#F2E8CF;border-radius:5px;overflow:hidden}
.xpBar i{display:block;height:100%;background:linear-gradient(90deg,#FFD54F,#FFB300)}
.petTrack{position:relative;height:120px;margin:8px 4px 0;border-radius:16px;background:linear-gradient(180deg,#DFF3FF 0%,#FFF6D8 100%);overflow:hidden}
.petImg{position:absolute;bottom:10px;left:4%;font-size:72px;line-height:1.2;cursor:pointer;filter:drop-shadow(0 6px 8px rgba(150,100,0,.2));animation:petRun 8s ease-in-out infinite;z-index:2}
@keyframes petRun{
  0%{left:4%;transform:scaleX(1) translateY(0)}
  12%{transform:scaleX(1) translateY(-16px)}
  24%{transform:scaleX(1) translateY(0)}
  36%{transform:scaleX(1) translateY(-16px)}
  46%{left:72%;transform:scaleX(1) translateY(0)}
  50%{left:74%;transform:scaleX(-1) translateY(0)}
  62%{transform:scaleX(-1) translateY(-16px)}
  74%{transform:scaleX(-1) translateY(0)}
  86%{transform:scaleX(-1) translateY(-16px)}
  96%{left:4%;transform:scaleX(-1) translateY(0)}
  100%{left:4%;transform:scaleX(1) translateY(0)}
}
.petImg.cute{animation:cuteAct 1.6s ease}
@keyframes cuteAct{
  0%{transform:scale(1) rotate(0)}
  20%{transform:scale(1.25) rotate(-14deg) translateY(-10px)}
  40%{transform:scale(1.25) rotate(14deg)}
  60%{transform:scale(1.2) rotate(-10deg) translateY(-8px)}
  80%{transform:scale(1.15) rotate(8deg)}
  100%{transform:scale(1) rotate(0)}
}
.heartFx{position:absolute;font-size:20px;pointer-events:none;animation:heartUp 1.5s ease-out forwards;z-index:3}
@keyframes heartUp{0%{opacity:0;transform:translateY(0) scale(.4)}20%{opacity:1}100%{opacity:0;transform:translateY(-80px) scale(1.3)}}

/* ---------- SVG 宠物动画 ---------- */
.petSvg{overflow:visible}
.petSvg .eye{transform-box:fill-box;transform-origin:center;animation:blink 4.4s infinite}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}94.5%{transform:scaleY(.08)}}
.petSvg .breathe{transform-box:fill-box;transform-origin:50% 100%;animation:breath 2.6s ease-in-out infinite}
@keyframes breath{0%,100%{transform:scale(1,1)}50%{transform:scale(1.04,.96)}}
.petSvg .wag{transform-box:fill-box;transform-origin:0% 80%;animation:wag 1.4s ease-in-out infinite}
@keyframes wag{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(14deg)}}
.petSvg .flap{transform-box:fill-box;transform-origin:60% 20%;animation:flap .9s ease-in-out infinite}
@keyframes flap{0%,100%{transform:rotate(6deg)}50%{transform:rotate(-20deg)}}
.petSvg .legL{animation:stepY .5s ease-in-out infinite}
.petSvg .legR{animation:stepY .5s ease-in-out .25s infinite}
@keyframes stepY{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.petSvg .floaty{animation:floaty 2.2s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.petSvg .bub{animation:bubUp 2.6s linear infinite;opacity:0}
@keyframes bubUp{0%{opacity:0;transform:translateY(0)}15%{opacity:.85}100%{opacity:0;transform:translateY(-34px)}}

/* ---------- 聊天句子点读 ---------- */
.sent{cursor:pointer;border-radius:4px;padding:0 1px;transition:background .15s}
.sent:hover{background:#FFF3D1}
.sent.playing{background:#FFE9AE}
.petName{font-weight:900;font-size:16px;margin-top:2px}
.petBubble{position:relative;background:#fff;border:2px solid #F0E6CC;border-radius:16px;padding:10px 14px;margin:10px auto 4px;max-width:88%;font-size:14px;line-height:1.6;box-shadow:0 4px 10px rgba(180,130,20,.10)}
.petBubble::before{content:"";position:absolute;top:-9px;left:50%;transform:translateX(-50%) rotate(45deg);width:14px;height:14px;background:#fff;border-left:2px solid #F0E6CC;border-top:2px solid #F0E6CC}
.petBubble .pSay{display:flex;align-items:center;gap:8px;justify-content:center}
.petBubble .pSay button{border:none;background:#FFF0C4;border-radius:10px;font-size:16px;padding:4px 10px;cursor:pointer;flex:none}
.petBtns{display:flex;gap:10px;justify-content:center;margin-top:12px}
.taskRow{display:flex;align-items:center;gap:10px;border-radius:14px;padding:12px 14px;margin-bottom:10px}
.taskRow .no{width:24px;height:24px;border-radius:50%;color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:13px;flex:none}
.taskRow .tinfo{flex:1;min-width:0}
.taskRow .tname{font-weight:800;font-size:14px;margin-bottom:5px}
.taskRow .tbar{height:7px;border-radius:4px;background:rgba(255,255,255,.7);overflow:hidden}
.taskRow .tbar i{display:block;height:100%;border-radius:4px}
.taskRow .txp{font-size:13px;font-weight:800;flex:none}
.taskRow .tfood{font-size:22px;flex:none}
.tkY{background:#FFF0C8} .tkY .no{background:#F0A500} .tkY .tbar i{background:#F5B301} .tkY .txp{color:#D88E00}
.tkP{background:#FFE3EE} .tkP .no{background:#F56AA0} .tkP .tbar i{background:#F56AA0} .tkP .txp{color:#E14E8B}
.tkB{background:#DDEBFF} .tkB .no{background:#4A86F0} .tkB .tbar i{background:#4A86F0} .tkB .txp{color:#2F6BD8}
.petGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0 14px}
.petOpt{border:2.5px solid #EFE6CC;background:#FFFDF6;border-radius:16px;padding:12px 4px;text-align:center;cursor:pointer}
.petOpt .pe{font-size:38px}
.petOpt .pn{font-size:13px;font-weight:800;margin-top:4px}
.petOpt.on{border-color:#F0B429;background:#FFF6DB;box-shadow:0 3px 10px rgba(224,150,0,.2)}

/* ---------- tabbar ---------- */
#tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;
  background:rgba(255,255,255,.96);backdrop-filter:blur(8px);display:flex;padding:8px 6px 14px;
  border-top:1px solid #F0E6CC;z-index:40}
#tabbar .tab{flex:1;text-align:center;cursor:pointer;color:#A99C80}
#tabbar .tab .ic{width:44px;height:30px;margin:0 auto;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:20px;transition:.2s}
#tabbar .tab .lb{font-size:11px;font-weight:700;margin-top:2px}
#tabbar .tab.on{color:#8A6100}
#tabbar .tab.on .ic{background:linear-gradient(180deg,#FFD54F,#FFB300);box-shadow:0 3px 8px rgba(224,150,0,.35)}

/* ---------- session overlay ---------- */
#session{position:fixed;inset:0;z-index:60;background:linear-gradient(180deg,#FFB800 0,#FFCE4A 180px,#FFE9AE 340px,#FFF7E6 480px);overflow-y:auto;display:none}
#session .wrap{max-width:520px;margin:0 auto;padding:16px 16px 40px;min-height:100%}
.sHead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sClose{width:38px;height:38px;border-radius:50%;border:none;background:rgba(255,255,255,.7);font-size:17px;cursor:pointer;font-weight:900;color:#8A6100}
.sProg{flex:1;height:9px;background:rgba(255,255,255,.55);border-radius:6px;overflow:hidden}
.sProg i{display:block;height:100%;background:#fff;border-radius:6px;transition:width .3s}
.sCard{background:#fff;border-radius:22px;box-shadow:0 8px 24px rgba(160,110,10,.14);padding:26px 20px;text-align:center}
.bigWord{font-size:38px;font-weight:900;letter-spacing:.5px}
.phon{font-size:17px;color:var(--muted);margin:6px 0 2px}
.zhBig{font-size:20px;font-weight:800;margin-top:10px}
.optBtn{display:block;width:100%;margin:10px 0;border:2px solid #EFE6CC;background:#FFFDF6;border-radius:16px;padding:15px;font-size:17px;font-weight:800;cursor:pointer;color:var(--ink);text-align:left;padding-left:20px}
.optBtn:active{transform:scale(.98)}
.optBtn.right{border-color:#7CCB93;background:#EAF9EE;color:#2E9E4F}
.optBtn.wrong{border-color:#F5A3A3;background:#FDECEC;color:#D64545}
.optBtn:disabled{cursor:default}
.spkBtn{display:inline-flex;align-items:center;justify-content:center;width:64px;height:64px;border-radius:50%;border:none;cursor:pointer;
  background:linear-gradient(180deg,#FFD54F,#FFB300);font-size:27px;box-shadow:0 4px 0 #E09600,0 8px 16px rgba(224,150,0,.3)}
.spkBtn:active{transform:translateY(3px);box-shadow:0 1px 0 #E09600}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px 0}
.tileL{width:44px;height:52px;border-radius:10px;border:2px solid #EFE6CC;background:#FFFDF6;font-size:24px;font-weight:900;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
.tileL.sel{background:#FFF0C4;border-color:#F0B429;color:#8A6100}
.answerLine{display:flex;gap:8px;justify-content:center;margin:14px 0;flex-wrap:wrap}
.slot{width:38px;height:48px;border-bottom:3px solid #D8CBA4;font-size:26px;font-weight:900;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.slot.fill{border-color:#F0B429;color:#8A6100}
.shake{animation:shk .4s}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.resStar{font-size:44px;letter-spacing:6px}
.emmaBox{background:var(--purpleBg);border-radius:14px;padding:13px 15px;text-align:left;font-size:14px;line-height:1.6;margin-top:14px}
.emmaBox b{color:#6B4BD8}

/* ---------- bottom sheet ---------- */
#sheetBk{position:fixed;inset:0;background:rgba(60,40,0,.35);z-index:70;display:none}
#sheet{position:fixed;top:50%;left:50%;bottom:auto;transform:translate(-50%,-50%);width:calc(100% - 24px);max-width:520px;background:#fff;border-radius:24px;z-index:71;display:none;max-height:86vh;overflow-y:auto;padding:8px 20px 30px;isolation:isolate;box-shadow:0 18px 60px rgba(70,45,0,.28)}
#sheet .grab{width:44px;height:5px;border-radius:3px;background:#E8DFC8;margin:8px auto 14px}
#sheet h3{text-align:center;font-size:18px;margin:0 42px 14px}
.sheetClose{position:absolute;right:14px;top:12px;width:34px;height:34px;border:0;border-radius:50%;background:#FFF4D5;color:#8B6500;font-size:25px;line-height:30px;font-weight:700;cursor:pointer;z-index:2}
.sheetClose:hover{background:#FFD36A;color:#5B3B00}
.sheetClose:active{transform:scale(.92)}
.stepper{display:flex;align-items:center;justify-content:center;gap:22px;margin:18px 0}
.stepper button{width:46px;height:46px;border-radius:50%;border:none;background:#FFF0C4;font-size:24px;font-weight:900;color:#B8860B;cursor:pointer;box-shadow:0 3px 0 #EAD9A8}
.stepper button:active{transform:translateY(2px);box-shadow:none}
.stepper .val{font-size:34px;font-weight:900;min-width:90px;text-align:center;color:#E67E00}
.stepper .val small{font-size:14px;color:var(--muted);font-weight:400}
.unitRow{display:flex;align-items:center;gap:12px;padding:13px 6px;border-bottom:1px solid #F4EDD9}
.unitRow:last-child{border:none}
.unitRow .uic{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.unitRow .uname{flex:1;min-width:0}
.unitRow .uname b{font-size:15px}
.unitRow .uprog{font-size:12px;color:var(--muted);margin-top:3px}

/* ---------- phonics / phoneme ---------- */
.phGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.phCell{background:#FFFDF6;border:2px solid #EFE6CC;border-radius:14px;padding:12px 4px;text-align:center;cursor:pointer}
.phCell .sym{font-size:21px;font-weight:900;color:#B8620B}
.phCell .ex{font-size:11px;color:var(--muted);margin-top:4px}
.ruleRow{background:#FFFDF6;border:1.5px solid #EFE6CC;border-radius:14px;padding:13px 15px;margin-bottom:10px}
.ruleRow .rh{display:flex;align-items:center;gap:10px;cursor:pointer}
.ruleRow .rp{font-weight:900;font-size:17px;color:#B8620B;min-width:64px}
.ruleRow .rn{flex:1;font-size:14px;font-weight:700}
.ruleRow .rbody{margin-top:10px;display:none}
.ruleRow.open .rbody{display:block}
.exWord{display:inline-block;background:#FFF0C4;border-radius:10px;padding:5px 12px;margin:4px 6px 0 0;font-weight:800;font-size:14px;cursor:pointer;color:#8A6100}
.exWord.bank{background:#DDEBFF;color:#2F6BD8}

/* ---------- chat ---------- */
.chatArea{height:44vh;overflow-y:auto;background:#FBF7EC;border-radius:16px;padding:14px;margin-bottom:12px}
.bub{max-width:88%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.7;margin-bottom:10px;white-space:pre-wrap;word-break:break-word}
.bubAi{background:#fff;box-shadow:0 2px 6px rgba(180,130,20,.08);border-top-left-radius:4px}
.bubMe{background:linear-gradient(180deg,#FFD54F,#FFB300);margin-left:auto;color:#5A3A00;border-top-right-radius:4px}
.chatInRow{display:flex;gap:8px}
.chatInRow input{flex:1;border:2px solid #EFE6CC;border-radius:14px;padding:11px 14px;font-size:15px;outline:none;background:#fff}
.chatSend{border:none;border-radius:14px;padding:0 18px;background:linear-gradient(180deg,#FFD54F,#FFB300);font-weight:900;color:#5A3A00;font-size:15px;cursor:pointer;box-shadow:0 3px 0 #E09600}
.chatSend:active{transform:translateY(2px);box-shadow:none}
.chatMic{border:none;border-radius:14px;padding:0 14px;background:#FFE9F2;font-size:19px;cursor:pointer}
.spin{display:inline-block;animation:spn 1s linear infinite}
@keyframes spn{to{transform:rotate(360deg)}}

/* ---------- form ---------- */
.fRow{margin-bottom:14px}
.fRow label{display:block;font-size:13px;font-weight:800;margin-bottom:6px;color:var(--ytext)}
.fRow input{width:100%;border:2px solid #EFE6CC;border-radius:12px;padding:11px 14px;font-size:15px;outline:none;background:#FFFDF6}

/* ---------- 档案门（家庭多账号） ---------- */
#gate{position:fixed;inset:0;z-index:90;display:none;overflow-y:auto;
  background:linear-gradient(180deg,#FFB800 0,#FFCE4A 220px,#FFE9AE 400px,#FFF7E6 560px)}
#gate .gwrap{max-width:640px;margin:0 auto;padding:46px 20px 60px;text-align:center;min-height:100%}
#gate .glogo{font-size:58px;filter:drop-shadow(0 4px 6px rgba(150,100,0,.25))}
#gate h2{font-size:27px;font-weight:900;margin:10px 0 4px}
#gate .gsub{color:#7A6A45;font-size:14px;margin-bottom:26px}
.profGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.profCard{background:#fff;border-radius:22px;padding:20px 12px;cursor:pointer;position:relative;
  box-shadow:0 6px 16px rgba(180,130,20,.14);transition:.15s}
.profCard:active{transform:scale(.96)}
.profCard .av{font-size:50px;line-height:1.2}
.profCard .nm{font-weight:900;font-size:16px;margin-top:8px}
.profCard .lk{position:absolute;top:10px;right:12px;font-size:14px;opacity:.65}
#gate .gmanage{margin-top:28px;background:rgba(255,255,255,.6);border:none;border-radius:16px;padding:12px 24px;font-weight:800;color:#8A6100;cursor:pointer;font-size:14px}
#gate .gmanage:active{transform:translateY(2px)}
#gate .gtip{margin-top:20px;font-size:12px;color:#8A7452;line-height:1.8}

/* 档案弹层（PIN / 家长管理） */
#gateSheet{position:fixed;inset:0;z-index:95;display:none;background:rgba(60,40,0,.45)}
#gateSheet .gsBox{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:calc(100% - 32px);max-width:430px;
  background:#fff;border-radius:24px;padding:22px 20px 24px;box-shadow:0 20px 60px rgba(70,45,0,.3);max-height:86vh;overflow-y:auto}
#gateSheet .gsBox h3{text-align:center;font-size:18px;margin-bottom:6px}
.pinDots{display:flex;justify-content:center;gap:14px;margin:18px 0 20px}
.pinDots i{width:16px;height:16px;border-radius:50%;background:#F0E6CC;display:block}
.pinDots i.on{background:#FFB300}
.pinKeys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:264px;margin:0 auto}
.pinKeys button{height:56px;border:none;border-radius:16px;font-size:22px;font-weight:900;background:#FFF7E6;color:#7A5A00;cursor:pointer;box-shadow:0 3px 0 #EAD9A8}
.pinKeys button:active{transform:translateY(2px);box-shadow:none}
.pinErr{color:#D64545;text-align:center;font-size:13px;font-weight:700;height:18px;margin-top:12px}

/* ---------- 云端同步 ---------- */
.cbRow{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700}
.cbDot{width:9px;height:9px;border-radius:50%;background:#C9BFA6;flex:none;display:inline-block}
.cbDot.on{background:#4CC36A;box-shadow:0 0 0 3px rgba(76,195,106,.18)}
.cbDot.off{background:#E0A63B}
.cbDot.err{background:#D64545}
.pwWrap{position:relative}
.pwWrap input{padding-right:46px}
.pwWrap .eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:none;background:transparent;font-size:18px;cursor:pointer;padding:6px;line-height:1}
#gate .gcloud{margin-top:18px;background:rgba(255,255,255,.78);border-radius:16px;padding:13px 15px;text-align:left}
#gate .gcloud .cbBtns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
#gate .gcloud .cbBtns button{flex:1;min-width:104px}

/* ---------- toast ---------- */
#toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:rgba(50,35,5,.88);color:#FFE9A8;padding:11px 22px;border-radius:24px;font-size:14px;font-weight:700;z-index:99;display:none;max-width:86%;text-align:center}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:8px;margin-left:6px;vertical-align:2px}
.tagW{background:#FDECEC;color:#D64545}
.tagF{background:#DDEBFF;color:#2F6BD8}
.xpPop{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);font-size:34px;font-weight:900;color:#FF9F2E;text-shadow:0 2px 8px rgba(255,160,0,.4);z-index:99;animation:xpup 1.2s forwards;pointer-events:none}
@keyframes xpup{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-120%) scale(1)}}
.confetti{position:fixed;font-size:26px;z-index:98;animation:cfall 2.2s ease-in forwards;pointer-events:none}
@keyframes cfall{0%{transform:translateY(-40px) rotate(0);opacity:1}100%{transform:translateY(105vh) rotate(540deg);opacity:.4}}

/* ---------- 键盘提示（仅大屏显示） ---------- */
.kbHint{display:none}
.dayList{break-inside:avoid;margin-top:8px}

/* ---------- 鼠标悬停反馈 ---------- */
@media(hover:hover) and (pointer:fine){
  .tile:hover{filter:brightness(.97);transform:translateY(-2px);box-shadow:0 6px 14px rgba(180,130,20,.14);transition:.15s}

  .phCell:hover{border-color:#F0B429}
  .wRow:hover{background:#FFF9E6;border-radius:8px}
  .todayBtn:hover{filter:brightness(1.03)}
  .petOpt:hover{border-color:#F0B429}
}

  .topbar .ttl{font-size:30px}

  .phGrid{grid-template-columns:repeat(6,1fr)}
  .petImg{font-size:108px}

<script>
/* ==================== 教材库 ==================== */
const BOOKS = window.WORD_BOOKS || (window.WORD_DATA?{"6A":window.WORD_DATA}:null);
/* 词库是否就位：words-data.js 没上传/路径不对时，这里为 false。
   后续所有入口都要先看这个标志，避免用户看到「界面正常但点了没反应」。 */
const WORDS_OK = !!(BOOKS && Object.keys(BOOKS).length);
const BOOK_ORDER=["6A","6B","7A","7B","8A","8B","9A","9B"];
const BOOK_META={
  "6A":{title:"六年级上册",cover:"六年级 上册"},
  "6B":{title:"六年级下册",cover:"六年级 下册"},
  "7A":{title:"七年级上册",cover:"七年级 上册"},
  "7B":{title:"七年级下册",cover:"七年级 下册"},
  "8A":{title:"八年级上册",cover:"八年级 上册"},
  "8B":{title:"八年级下册",cover:"八年级 下册"},
  "9A":{title:"九年级上册",cover:"九年级 上册"},
  "9B":{title:"九年级下册",cover:"九年级 下册"}
};
const UICON_POOL=["🏫","👨‍👩‍👧","🍎","⚽","🦁","🗺️","🌈","🚀","🎭","🌍","📚","🎵","🌟","🎨"];
const UBG_POOL=["var(--blueBg)","var(--greenBg)","var(--pinkBg)","var(--orangeBg)","var(--purpleBg)"];
const bookAvail=id=>!!(BOOKS&&BOOKS[id]&&BOOKS[id].units&&BOOKS[id].units.length);
const curBookData=()=>{ if(!BOOKS)return null; return BOOKS[S.book]||BOOKS[BOOK_ORDER.find(bookAvail)]; };
const unitIcon=(u,i)=>UICON_POOL[i%UICON_POOL.length];
const unitBg=(u,i)=>UBG_POOL[i%UBG_POOL.length];

/* ==================== state（家庭多档案） ==================== */
const todayStr0=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const HUB_KEY="emmaHub", DATA_PREFIX="emmaData_";
const AVATARS=["👧","👦","🧒","🐰","🐻","🦊","🐯","🐼"];
let HUB=null, S=null, curPid=null;

function saveHub(){ localStorage.setItem(HUB_KEY,JSON.stringify(HUB)); }
function loadHub(){
  try{ HUB=JSON.parse(localStorage.getItem(HUB_KEY)||"null"); }catch(e){ HUB=null; }
  if(HUB&&HUB.profiles&&HUB.profiles.length){ if(!HUB.seq)HUB.seq=HUB.profiles.length; return; }
  // 首次运行：把旧的单档案 emmaW2 迁移为第一个孩子档案
  HUB={profiles:[],parentPin:"",seq:1};
  let old=null; try{ old=JSON.parse(localStorage.getItem("emmaW2")||"null"); }catch(e){}
  HUB.profiles.push({id:"p1",name:"EMMA",avatar:"👧",pin:""});
  if(old)localStorage.setItem(DATA_PREFIX+"p1",JSON.stringify(old));
  saveHub();
}
const profileById=id=>HUB.profiles.find(p=>p.id===id);
function newProfileId(){ HUB.seq=(HUB.seq||1)+1; return "p"+HUB.seq; }
function loadProfileData(id){ let d=null; try{ d=JSON.parse(localStorage.getItem(DATA_PREFIX+id)||"null"); }catch(e){} return d||{xp:0,minutes:{}}; }
function normalizeState(){
  if(!S)S={xp:0,minutes:{}};
  if(!S.book||!bookAvail(S.book))S.book=BOOK_ORDER.find(bookAvail)||"6A";
  if(!S.books)S.books={};
  if(S.words){ S.books["6A"]={plan:S.plan||{dailyNew:6,startDate:todayStr0()},words:S.words,claimed:S.claimed||{}}; delete S.words; delete S.plan; delete S.claimed; }
  if(!S.pet)S.pet={type:"dog",name:"Lucky"};
  if(!S.tts)S.tts={on:true,model:"stepaudio-2.5-tts",voice:"default"};
  if(S.ttsAuto===undefined)S.ttsAuto=true;
  if(!S.ai)S.ai={base:"https://engine.atomclub.cn/v1",model:"deepseek-v3.2",key:""};
  // 云端同步可能带来不含密钥的 ai 对象（密钥绝不入云），这里补齐字段
  if(S.ai.key===undefined)S.ai.key="";
  if(!S.ai.base)S.ai.base="https://engine.atomclub.cn/v1";
  if(!S.ai.model)S.ai.model="deepseek-v3.2";
  if(!S._updated)S._updated=Date.now();
}
const BS=()=>{ if(!S.books[S.book])S.books[S.book]={plan:{dailyNew:6,startDate:todayStr0()},words:{},claimed:{}}; return S.books[S.book]; };
function save(){
  if(S&&curPid)localStorage.setItem(DATA_PREFIX+curPid,JSON.stringify(S));
  schedulePush();   // 本地写入永远立即生效；云端推送做 4 秒防抖（见「云端同步」段）
}

/* ==================== 词表工具 ==================== */
let ALL=[],byId={};
const widOf=w=>w.unit+":"+w.w;
function loadBookWords(){
  ALL=[];byId={};
  const bd=curBookData(); if(!bd)return;
  bd.units.forEach((u,i)=>u.words.forEach(w=>ALL.push({w:w.w,ph:w.ph||w.ipa||"",pos:w.pos||"",zh:w.zh,emma:w.emma||"",unit:u.id,unitTitle:u.title,uidx:i})));
  ALL.forEach(w=>byId[widOf(w)]=w);
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const todayStr=todayStr0;
const addDays=(ds,n)=>{const d=new Date(ds+"T12:00:00");d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const INT=[1,2,4,7,15,30];

const recOf=(id,create)=>{ const ws=BS().words; if(!ws[id]&&create)ws[id]={learned:false,box:0,due:todayStr(),wrong:0,fav:false,ok:0}; return ws[id]; };
const learnedList=()=>ALL.filter(w=>{const r=BS().words[widOf(w)];return r&&r.learned});
const masteredList=()=>ALL.filter(w=>{const r=BS().words[widOf(w)];return r&&r.learned&&r.box>=3});
const newBatch=()=>ALL.filter(w=>{const r=BS().words[widOf(w)];return !(r&&r.learned)}).slice(0,BS().plan.dailyNew);
const reviewBatch=()=>ALL.filter(w=>{const r=BS().words[widOf(w)];return r&&r.learned&&r.due<=todayStr()});
const wrongList=()=>ALL.filter(w=>{const r=BS().words[widOf(w)];return r&&r.learned&&r.wrong>0&&r.box<2});
const favList=()=>ALL.filter(w=>{const r=BS().words[widOf(w)];return r&&r.fav});
function dayIdx(){ const a=new Date(BS().plan.startDate+"T12:00:00"),b=new Date(todayStr()+"T12:00:00"); return Math.max(0,Math.floor((b-a)/86400000)); }
function newDoneToday(){ return BS().claimed["new:"+todayStr()+"_cnt"]||0; }
function revDoneToday(){ return BS().claimed["rev:"+todayStr()+"_cnt"]||0; }
function minutesToday(){ return Math.round(S.minutes[todayStr()]||0); }
function level(){ return Math.floor(S.xp/100)+1; }

/* ==================== 宠物系统 ==================== */
const PET_TYPES={
  dog:{name:"小狗",stages:["🐶","🐕","🦮"],cry:"Woof!"},
  cat:{name:"小猫",stages:["🐱","🐈","😸"],cry:"Meow!"},
  fish:{name:"小鱼",stages:["🐟","🐠","🐡"],cry:"Blub!"},
  bird:{name:"小鸟",stages:["🐣","🐥","🦅"],cry:"Tweet!"},
  dino:{name:"小恐龙",stages:["🥚","🦖","🦕"],cry:"Roar!"},
  pig:{name:"小猪",stages:["🐷","🐽","🐖"],cry:"Oink!"}
};
function petEmoji(){ const t=PET_TYPES[S.pet.type]||PET_TYPES.dog; return t.stages[Math.min(Math.floor((level()-1)/2),t.stages.length-1)]; }
function petCry(){ return (PET_TYPES[S.pet.type]||PET_TYPES.dog).cry; }
const PET_GREET=[
  "Hi EMMA! I'm {name}! {cry}",
  "Good to see you! Let's learn English!",
  "Ready to study with me? {cry}",
  "Hello! I missed you so much!",
  "One word a day, keeps the boredom away!"
];
const PET_PRAISE=[
  "Great job, EMMA! You are amazing!",
  "Wow! You did it! I'm so proud of you!",
  "Yummy! Your words are my favorite food!",
  "Super! You make me smarter too!",
  "High five! You are a superstar!"
];
const PET_HUNGRY=[
  "I'm hungry… Feed me some words! {cry}",
  "Can we learn one more word? Please?",
  "Words, words, I need words! {cry}"
];
function petSay(line){ S.petLine=line; save(); }
function petGreet(){
  const h=new Date().getHours();
  let line;
  if(h<9)line="Good morning, EMMA! A new day, new words!";
  else if(h<14)line="Good afternoon! Ready for some English?";
  else if(h<20)line="Good evening! Let's study together!";
  else line="Wow, still studying? You are a hard worker!";
  petSay(petCry()+" "+line);
}
function petPraise(){ petSay(petCry()+" "+PET_PRAISE[Math.floor(Math.random()*PET_PRAISE.length)]); }
function petSpeakLine(){ if(S.petLine)speakSmart(S.petLine.replace(/[🐶🐱🐟🐣🥚🐷⭐🐾💕💖💗✨]/g,""),1.0,petPitch()); }

/* ---------- SVG 宠物造型（灵动版） ---------- */
const FACE=(cy,mouth)=>`
 <g class="eye"><circle cx="49" cy="${cy}" r="4.4" fill="#3A2E1A"/><circle cx="50.6" cy="${cy-1.6}" r="1.5" fill="#fff"/></g>
 <g class="eye"><circle cx="71" cy="${cy}" r="4.4" fill="#3A2E1A"/><circle cx="72.6" cy="${cy-1.6}" r="1.5" fill="#fff"/></g>
 <ellipse cx="41" cy="${cy+8}" rx="4.6" ry="2.8" fill="#FF9FB0" opacity=".55"/>
 <ellipse cx="79" cy="${cy+8}" rx="4.6" ry="2.8" fill="#FF9FB0" opacity=".55"/>
 ${mouth?`<path d="M54 ${cy+8} Q60 ${cy+13} 66 ${cy+8}" stroke="#3A2E1A" stroke-width="2.2" fill="none" stroke-linecap="round"/>`:""}`;
const LEGS=c=>`<ellipse class="legL" cx="48" cy="90" rx="9" ry="4.6" fill="${c}"/><ellipse class="legR" cx="72" cy="90" rx="9" ry="4.6" fill="${c}"/>`;
const CROWN=`<g transform="translate(8,-8) rotate(12 60 22)"><path d="M48 26 l5 -10 7 7 7 -7 5 10 Z" fill="#FFD54F" stroke="#E8A200" stroke-width="1.6" stroke-linejoin="round"/></g>`;
const PET_ART={
 dog:`<path class="wag" d="M88 66 Q104 60 106 46" stroke="#C98B4E" stroke-width="7" fill="none" stroke-linecap="round"/>
  <ellipse cx="33" cy="42" rx="9" ry="17" fill="#B87B42" transform="rotate(16 33 42)"/>
  <ellipse cx="87" cy="42" rx="9" ry="17" fill="#B87B42" transform="rotate(-16 87 42)"/>
  <g class="breathe">
   <ellipse cx="60" cy="64" rx="32" ry="27" fill="#D9A066"/>
   ${FACE(50,false)}
   <ellipse cx="60" cy="66" rx="15" ry="11" fill="#F2D7B6"/>
   <circle cx="60" cy="62" r="4" fill="#6B4A2E"/>

let voiceEn=null, voiceZh=null;
let voiceTries=0;
function pickVoice(){
  const vs=speechSynthesis.getVoices();
  if(!vs||!vs.length){
    // 安卓上语音列表常常是异步就绪的，首次读到空要重试几次
    if(voiceTries<6){ voiceTries++; setTimeout(function(){ if("speechSynthesis" in window)pickVoice(); },500); }
    return;
  }
  voiceEn=vs.find(v=>/en-GB/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;
  voiceZh=vs.find(v=>/zh-CN/i.test(v.lang))||vs.find(v=>/^zh/i.test(v.lang))||null;
}
if("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }

  }else if(!hasKey){

        '<div style="height:10px"></div><b>最快的办法：填 Key，用云端朗读</b>（音色也更好听）<br>'+

          ? '<div style="height:8px"></div>或者装系统语音包：<br>设置 → 系统 → 语言和输入法 → 文字转语音 → 安装英文语音数据'
          : '<div style="height:8px"></div>若想用本地朗读，需改用 Chrome / Safari / Edge 打开本页面');
  }else if(!hasSS){
    msg='这个浏览器不支持语音朗读，而云端朗读这次也没成功。<br>请改用 <b>Chrome / Safari / Edge</b> 打开本页面。';
  }else{
    msg='本机没有可用的系统语音，朗读无法出声。<br>请安装系统语音包，或检查云端朗读是否正常。';
  }

function speak(t,rate,pitch){
  if(!("speechSynthesis" in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);
  const cjk=(t.match(/[\u4e00-\u9fff]/g)||[]).length, lat=(t.match(/[a-zA-Z]/g)||[]).length;
  const zh=cjk>lat*0.5;
  u.lang=zh?"zh-CN":"en-GB";
  const v=zh?(voiceZh||voiceEn):(voiceEn||voiceZh); if(v)u.voice=v;
  u.rate=rate||0.85; u.pitch=(pitch===undefined?1.0:pitch);
  speechSynthesis.speak(u);
}
const PET_PITCH={dog:1.3,cat:1.8,fish:2.0,bird:2.0,dino:0.6,pig:1.1};

let audioEl=null;
async function cloudSpeak(text,rate){
  if(!S.ai.key||!S.tts||!S.tts.on)return false;
  try{
    const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(),12000);
    const url=S.ai.base.replace(/\/+$/,"")+"/audio/speech";
    const r=await fetch(url,{
      method:"POST",signal:ctl.signal,
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+S.ai.key},
      body:JSON.stringify({model:S.tts.model||"stepaudio-2.5-tts",voice:S.tts.voice||"default",input:text.slice(0,600),response_format:"mp3"})
    });
    clearTimeout(to);
    if(!r.ok){
      console.warn("[cloudSpeak] HTTP "+r.status+" from "+url+" model="+S.tts.model);
      if(r.status===401) toast("语音鉴权失败：请检查API Key和语音模型权限");
      else if(r.status===404) toast("该网关可能不支持语音端点 /v1/audio/speech");
      else if(r.status===422) toast("语音参数错误（模型名或音色可能不支持）");
      return false;
    }
    // 检查响应类型——部分网关可能返回 JSON 包裹的 base64 而非纯音频流
    const ct=r.headers.get("content-type")||"";
    if(ct.includes("application/json")){
      const j=await r.json();
      // new-api 类网关有时把音频包在 data.audio (base64) 或直接给 mp3_url
      if(j.data&&j.data.audio){ await playBase64(j.data.audio,rate); return true; }
      if(j.audio_url){ await fetchAndPlay(j.audio_url,rate); return true; }
      if(j.data&&j.data.url){ await fetchAndPlay(j.data.url,rate); return true; }
      if(j.url){ await fetchAndPlay(j.url,rate); return true; }
      // atomclub new-api_error 格式："error":{"message":"Invalid token","type":"new_api_error"}
      if(j.error&&j.error.type==="new_api_error"){
        console.warn("[cloudSpeak] new_api_error:",j.error.message);
        return false;
      }
      console.warn("[cloudSpeak] JSON response but unknown audio field:",Object.keys(j).slice(0,8));
      return false;
    }
    const b=await r.blob();
    if(!ct.includes("audio")&&!b.type.includes("audio")&&b.size<2000)return false;
    if(audioEl)audioEl.pause();
    audioEl=new Audio(URL.createObjectURL(b));
    if(rate)audioEl.playbackRate=Math.min(2,Math.max(.5,rate));
    await audioEl.play();
    return true;
  }catch(e){ console.warn("[cloudSpeak] fetch failed:",e.message); return false; }
}
async function playBase64(b64,rate){
  const raw=atob(b64); const arr=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++)arr[i]=raw.charCodeAt(i);
  const blob=new Blob([arr],{type:"audio/mp3"});
  if(audioEl)audioEl.pause();
  audioEl=new Audio(URL.createObjectURL(blob));
  if(rate)audioEl.playbackRate=Math.min(2,Math.max(.5,rate));
  await audioEl.play();
}
async function fetchAndPlay(url,rate){
  const r2=await fetch(url); if(!r2.ok)return;
  const b2=await r2.blob();
  if(audioEl)audioEl.pause();
  audioEl=new Audio(URL.createObjectURL(b2));
  if(rate)audioEl.playbackRate=Math.min(2,Math.max(.5,rate));
  await audioEl.play();
}
async function speakSmart(t,rate,pitch){
  if("speechSynthesis" in window)speechSynthesis.cancel();
  if(audioEl)audioEl.pause();
  const cjk=(String(t).match(/[\u4e00-\u9fff]/g)||[]).length;
  const lat=(String(t).match(/[a-zA-Z]/g)||[]).length;
  // 中文优先使用系统普通话音色，避免英文云端音色读中文失真
  if(cjk>lat*0.35){ speak(t,rate,undefined); checkVoiceOnce(false); return Promise.resolve(false); }
  return cloudSpeak(t,rate).then(ok=>{ if(!ok){ speak(t,rate,pitch); checkVoiceOnce(true); } return ok; });
}

async function callAI(messages){
  const cfg=S.ai;
  if(!cfg||!cfg.key||!cfg.base){ const e=new Error("NOCONF"); e.noconf=true; throw e; }
  let r;
  try{
    r=await fetch(cfg.base.replace(/\/+$/,"")+"/chat/completions",{
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+cfg.key},
      body:JSON.stringify({model:cfg.model||"deepseek-v3.2",messages,temperature:0.7,max_tokens:900})
    });
  }catch(netErr){
    const inPreview=/^(127\.0\.0\.1|localhost)(:|$)/.test(location.host);
    throw new Error(inPreview
      ?"预览面板的安全策略(CSP)会拦截外部API请求——请用 Edge/Chrome 直接双击打开 index.html 文件使用"
      :"无法连接服务器（"+(netErr&&netErr.message||"网络错误")+"）：请检查网络或接口地址");
  }
  if(!r.ok){ const t=await r.text().catch(()=> ""); let msg=t.slice(0,160); try{ msg=JSON.parse(t).error.message||msg; }catch(e){}
    if(r.status===401||r.status===403)msg="API Key 无效或余额不足："+msg;
    else if(r.status===429)msg="触发限流，请稍后再试";
    else if(r.status===404)msg="接口地址或模型名不对（404）："+msg;
    throw new Error(msg); }
  const j=await r.json();
  return (j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content||"").trim();
}

function bubHtml(role,text,clickable){
  let inner=esc(text);
  if(clickable&&role!=="user")inner=sentHtml(text);
  return `<div class="bub ${role==="user"?"bubMe":"bubAi"}">${inner}</div>`;
}
function sentHtml(text){
  let parts=null;
  try{ parts=text.split(new RegExp("\\n+|(?<=[。！？!?；;])|(?<=\\.)\\s+")).filter(s=>s&&s.trim()); }catch(e){ parts=null; }
  if(!parts||!parts.length)return esc(text);
  return parts.map(s=>`<span class="sent" onclick="replaySent(this)">${esc(s.trim())}</span>`).join("");
}
function replaySent(el){
  document.querySelectorAll(".sent.playing").forEach(e=>e.classList.remove("playing"));
  el.classList.add("playing");
  speakSmart(el.textContent,1.0,(CHAT&&CHAT.kind==="pet")?petPitch():1.0);
  setTimeout(()=>el.classList.remove("playing"),Math.min(6000,600+el.textContent.length*120));
}
function toggleTts(){
  S.ttsAuto=!S.ttsAuto; save();
  const el=document.getElementById("ttsTog");
  if(el)el.textContent=S.ttsAuto?"🔊 自动朗读":"🔇 已静音";
  if(!S.ttsAuto){ if("speechSynthesis" in window)speechSynthesis.cancel(); if(audioEl)audioEl.pause(); }

}
async function sendChat(preset){
  if(!CHAT||CHAT.busy)return;
  const inp=document.getElementById("chatIn");
  const text=(preset!==undefined?preset:inp.value).trim();
  if(!text)return;
  if(!S.ai.key){ closeSheet(); sheetAISet("使用 AI 功能前，请先配置接口"); return; }
  const area=document.getElementById("chatArea");
  CHAT.msgs.push({role:"user",content:text});
  area.insertAdjacentHTML("beforeend",bubHtml("user",text));
  area.insertAdjacentHTML("beforeend",`<div class="bub bubAi" id="aiThinking"><span class="spin">⏳</span> 思考中…</div>`);
  area.scrollTop=area.scrollHeight; inp.value=""; CHAT.busy=true;
  try{
    const reply=await callAI(CHAT.msgs);
    CHAT.msgs.push({role:"assistant",content:reply});
    document.getElementById("aiThinking").outerHTML=bubHtml("ai",reply,true);
    if(S.ttsAuto){ speakSmart(reply.replace(/[*#>`\-]/g,""),0.98,CHAT.kind==="pet"?petPitch():1.0); }
  }catch(e){
    document.getElementById("aiThinking").outerHTML=`<div class="bub bubAi">😅 ${esc(e.message)}<br><span class="muted">如反复失败，请检查「我的 → AI 接口设置」。</span></div>`;
  }
  CHAT.busy=false; area.scrollTop=area.scrollHeight;
}

function spawnHearts(){
  const track=document.querySelector(".petTrack"); if(!track)return;
  const el=document.getElementById("petImgEl");

  for(let i=0;i<6;i++){
    const h=document.createElement("span"); h.className="heartFx";
    h.textContent=["💕","💖","💗","✨"][i%4];
    h.style.left=(baseLeft+16+Math.random()*44)+"px";
    h.style.bottom=(44+Math.random()*24)+"px";
    h.style.animationDelay=(i*0.12)+"s";
    track.appendChild(h); setTimeout(()=>h.remove(),1900);
  }

function exportData(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="emma-"+curProfileName()+"-"+todayStr()+".json"; a.click();

}
function importData(){
  const inp=document.createElement("input");
  inp.type="file"; inp.accept=".json,application/json";
  inp.style.display="none";
  inp.onchange=()=>{
    const f=inp.files&&inp.files[0]; if(!f)return;
    const fr=new FileReader();
    fr.onload=()=>{
      try{
        const d=JSON.parse(fr.result);
        if(!d||typeof d!=="object"||(d.xp===undefined&&!d.books&&!d.words&&!d.minutes))throw new Error("不是有效的进度文件");
        if(!confirm("导入将覆盖当前档案「"+curProfileName()+"」的全部进度，确定继续？"))return;
        S=d; normalizeState(); save(); render();
        toast("导入成功 ✓ "+curProfileName());
      }catch(e){ toast("❌ 文件无法解析："+e.message); }
    };
    fr.readAsText(f);
  };
  document.body.appendChild(inp); inp.click(); setTimeout(()=>inp.remove(),1000);
}
function resetAll(){ if(confirm("确定清空当前档案「"+curProfileName()+"」的全部学习数据？此操作不可恢复！")){ localStorage.removeItem(DATA_PREFIX+curPid); location.reload(); } }

function openSheet(html){ document.getElementById("sheet").innerHTML='<div class="grab"></div><button class="sheetClose" aria-label="关闭" onclick="closeSheet()">×</button>'+html; document.getElementById("sheet").style.display="block"; document.getElementById("sheetBk").style.display="block"; }
function closeSheet(){ document.getElementById("sheet").style.display="none"; document.getElementById("sheetBk").style.display="none"; CHAT=null; if("speechSynthesis" in window)speechSynthesis.cancel(); if(audioEl){audioEl.pause();audioEl.currentTime=0;} }

/* ==================== learning session ==================== */
let SES=null;
function startSession(mode,unitId){
  let list=[], phases;
  if(mode==="new"){ list=newBatch(); phases=["show","choice","spell","read"]; if(!list.length)return toast("今天的生词都学完啦，去复习一下吧 🎉"); }
  else if(mode==="review"){ list=reviewBatch(); phases=["choice","spell"]; if(!list.length)return toast("今天没有到期要复习的词，太棒了 ✨"); }
  else if(mode==="ulearn"){ list=ALL.filter(w=>w.unit===unitId); phases=["show","choice","spell","read"]; }
  else if(mode==="ureview"){ list=ALL.filter(w=>w.unit===unitId&&(BS().words[widOf(w)]||{}).learned); phases=["choice","spell"]; if(!list.length)return toast("这个单元还没有已学的单词"); }
  else if(mode==="challenge"){ list=[...ALL].sort(()=>Math.random()-.5).slice(0,15); phases=["choice","spell"]; }
  else if(mode==="wrong"){ list=wrongList(); phases=["choice","spell"]; if(!list.length)return toast("错题本是空的，继续保持 👏"); }
  else if(mode==="fav"){ list=favList(); phases=["choice","spell"]; if(!list.length)return toast("还没有收藏单词，去单词书点 ☆ 吧"); }
  else if(mode==="read"){ list=learnedList().length?[...learnedList()].sort(()=>Math.random()-.5).slice(0,10):ALL.slice(0,10); phases=["read"]; }
  SES={mode,list,idx:0,phase:0,phases,results:{},xp:0,startT:Date.now()};
  document.getElementById("session").style.display="block";
  renderStep();
}
function endSession(){
  const mins=(Date.now()-SES.startT)/60000;
  const d=todayStr(); S.minutes[d]=(S.minutes[d]||0)+mins;
  let correct=0,total=0;
  for(const id in SES.results){ total++; if(SES.results[id])correct++; }
  if(SES.mode==="new"||SES.mode==="ulearn"){ BS().claimed["new:"+d+"_cnt"]=(BS().claimed["new:"+d+"_cnt"]||0)+SES.list.length; }
  else { BS().claimed["rev:"+d+"_cnt"]=(BS().claimed["rev:"+d+"_cnt"]||0)+SES.list.length; }
  addXp(correct*2+(total&&correct/total>=0.8?10:0));
  checkTasks(); save();
  const stars=total?Math.round(correct/total*3):0;
  if(correct>0){ petPraise(); }
  const wrongIds=Object.keys(SES.results).filter(id=>!SES.results[id]);
  document.getElementById("sessionWrap").innerHTML=`
    <div class="sHead"><button class="sClose" onclick="closeSession()">✕</button><div class="sProg"><i style="width:100%"></i></div></div>
    <div class="sCard">
      <div style="font-size:54px">${stars>=3?"🏆":stars>=2?"🎉":"💪"}</div>
      <div class="resStar">${"★".repeat(stars)}${"☆".repeat(3-stars)}</div>
      <div style="font-size:19px;font-weight:900;margin:10px 0 4px">${SES.mode==="new"?"新学完成！":"挑战完成！"}</div>
      <div class="muted">答对 ${correct}/${total} · 用时 ${Math.max(1,Math.round(mins))} 分钟</div>
      ${wrongIds.length?`<div style="margin-top:14px;text-align:left"><b style="font-size:14px">📕 已加入错词本：</b><div style="margin-top:6px">${wrongIds.map(id=>`<span class="exWord" onclick="speak('${byId[id].w}')">${esc(byId[id].w)} 🔊</span>`).join("")}</div></div>`:""}
      <div style="height:18px"></div>
      <button class="btn3d" onclick="closeSession()">返回首页</button>
      <div style="height:10px"></div>
      <button class="btn2" style="width:100%" onclick="closeSession();startSession('${SES.mode==="new"?"review":"new"}')">${SES.mode==="new"?"去复习":"再学一组"}</button>
    </div>`;
  if(stars>=2)confetti();
}
function closeSession(){ document.getElementById("session").style.display="none"; SES=null; if("speechSynthesis" in window)speechSynthesis.cancel(); render(); }
function curWord(){ return SES.list[SES.idx]; }
function renderStep(){
  const w=curWord(), ph=SES.phases[SES.phase];
  const head=`<div class="sHead"><button class="sClose" onclick="closeSession()">✕</button><div class="sProg"><i style="width:${(SES.idx)/(SES.list.length)*100}%"></i></div><span style="font-weight:900;color:#8A6100;font-size:13px">${SES.idx+1}/${SES.list.length}</span></div>`;
  let body="";
  if(ph==="show"){
    body=`<div class="sCard">
      <div class="muted" style="margin-bottom:10px">第 1 步 · 认识新单词（${esc(w.unitTitle)}）</div>
      <div class="bigWord">${esc(w.w)}</div>
      <div class="phon">${esc(w.ph)}</div>
      <div class="zhBig">${esc(w.pos)} ${esc(w.zh)}</div>
      <div style="margin:20px 0"><button class="spkBtn" onclick="speak('${w.w}')">🔊</button></div>
      ${w.emma?`<div class="emmaBox"><b>🎨 EMMA 小卡片：</b>${esc(w.emma)}</div>`:""}
      <div style="height:18px"></div>
      <button class="btn3d" onclick="nextPhase()">我认识它了 →</button>
    </div>`;
    setTimeout(()=>speak(w.w),400);
  }
  else if(ph==="choice"){
    const pool=ALL.filter(x=>x.unit===w.unit&&x.w!==w.w);
    const extra=ALL.filter(x=>x.unit!==w.unit);
    const opts=[w,...pool.sort(()=>Math.random()-.5).slice(0,3)];
    while(opts.length<4&&extra.length)opts.push(extra.splice(Math.floor(Math.random()*extra.length),1)[0]);
    opts.sort(()=>Math.random()-.5);
    body=`<div class="sCard">
      <div class="muted" style="margin-bottom:14px">听发音，选出正确的意思</div>
      <button class="spkBtn" onclick="speak('${w.w}')">🔊</button>
      <div style="height:16px"></div>
      ${opts.map(o=>`<button class="optBtn" data-ok="${o.w===w.w?1:0}" onclick="ansChoice(this)">${esc(o.pos)} ${esc(o.zh)}</button>`).join("")}
    </div>`;
    setTimeout(()=>speak(w.w),350);
  }
  else if(ph==="spell"){
    const letters=w.w.replace(/[^a-zA-Z'-]/g,"").split("");
    const shuffled=[...letters].sort(()=>Math.random()-.5);
    SES.spell={target:letters.join("").toLowerCase(),picked:[]};
    body=`<div class="sCard">
      <div class="muted" style="margin-bottom:6px">听发音，拼出单词</div>
      <div class="zhBig">${esc(w.pos)} ${esc(w.zh)}</div>
      <div style="margin:14px 0 4px"><button class="spkBtn" style="width:52px;height:52px;font-size:22px" onclick="speak('${w.w}')">🔊</button></div>
      <div class="answerLine" id="slots">${letters.map(()=>'<span class="slot"></span>').join("")}</div>
      <div class="tiles" id="tileBox">${shuffled.map(l=>`<span class="tileL" onclick="pickTile(this)">${esc(l)}</span>`).join("")}</div>
      <div class="kbHint muted" style="margin-bottom:8px">⌨️ 可直接用键盘输入，Backspace 撤销</div>
      <div style="display:flex;gap:10px">
        <button class="btn2" style="flex:1" onclick="spellUndo()">⌫ 撤销</button>
        <button class="btn2" style="flex:1" onclick="spellHint()">💡 提示</button>
        <button class="btn2" style="flex:1" onclick="spellGiveUp()">跳过</button>
      </div>
    </div>`;
    setTimeout(()=>speak(w.w),350);
  }
  else if(ph==="read"){
    body=`<div class="sCard">
      <div class="muted" style="margin-bottom:10px">大声读出来！${SR?"读完自动评分":"（当前浏览器不支持语音评分，请自评）"}</div>
      <div class="bigWord">${esc(w.w)}</div>
      <div class="phon">${esc(w.ph)}</div>
      <div class="zhBig">${esc(w.pos)} ${esc(w.zh)}</div>
      <div style="display:flex;gap:18px;justify-content:center;margin:22px 0">
        <button class="spkBtn" style="background:linear-gradient(180deg,#9CC4FF,#5E9BFF);box-shadow:0 4px 0 #3D76D6" onclick="speak('${w.w}')">🔊</button>
        ${SR?`<button class="spkBtn" id="micBtn" style="background:linear-gradient(180deg,#FF9FC7,#F56AA0);box-shadow:0 4px 0 #D14E82" onclick="doRec()">🎙️</button>`:""}
      </div>
      <div id="recRes" class="muted"></div>
      ${SR?"":`<div style="display:flex;gap:10px;margin-top:14px"><button class="btn2" style="flex:1" onclick="readSelf(true)">✅ 我读得不错</button><button class="btn2" style="flex:1" onclick="readSelf(false)">🔁 还要练习</button></div>`}
      <div style="height:14px"></div>
      <button class="btn3d" onclick="nextWord()">下一个 →</button>
    </div>`;
    setTimeout(()=>speak(w.w),400);
  }
  document.getElementById("sessionWrap").innerHTML=head+body;
}
function nextPhase(){ SES.phase++; if(SES.phase>=SES.phases.length)return nextWord(); renderStep(); }
function markResult(ok){
  const id=widOf(curWord()); const r=recOf(id,true);
  const isNew=!r.learned;
  if(isNew){ r.learned=true; r.box=ok?1:0; r.due=addDays(todayStr(),1); if(!ok)r.wrong++; }
  else if(ok){ r.ok++; r.box=Math.min(5,r.box+1); r.due=addDays(todayStr(),INT[Math.min(r.box,INT.length)-1]); }
  else { r.box=0; r.due=addDays(todayStr(),1); r.wrong++; }
  SES.results[id]=(SES.results[id]||false)||ok;
  save();
}
function nextWord(){ SES.idx++; SES.phase=0; if(SES.idx>=SES.list.length)return endSession(); renderStep(); }
function ansChoice(btn){
  const ok=btn.dataset.ok==="1";
  document.querySelectorAll(".optBtn").forEach(b=>{ b.disabled=true; if(b.dataset.ok==="1")b.classList.add("right"); });
  if(!ok){ btn.classList.add("wrong"); btn.classList.add("shake"); speak(curWord().w); }
  else { speakPraise(); }
  markResult(ok);
  setTimeout(()=>nextPhase(), ok?900:1500);
}
function pickTile(el){
  if(el.classList.contains("sel"))return;
  el.classList.add("sel");
  SES.spell.picked.push(el);
  const slots=document.querySelectorAll("#slots .slot");
  slots[SES.spell.picked.length-1].textContent=el.textContent;
  slots[SES.spell.picked.length-1].classList.add("fill");
  if(SES.spell.picked.length===SES.spell.target.length){
    const got=SES.spell.picked.map(e=>e.textContent).join("").toLowerCase();
    const ok=got===SES.spell.target;
    if(ok){ markResult(true); speakPraise(); toast("拼对啦 ✨"); setTimeout(()=>nextPhase(),900); }
    else{ const sl=document.getElementById("slots"); sl.classList.add("shake"); speak(curWord().w);
      setTimeout(()=>{ SES.spell.picked.forEach(e=>e.classList.remove("sel")); SES.spell.picked=[]; slots.forEach(s=>{s.textContent="";s.classList.remove("fill")}); sl.classList.remove("shake"); },700);
    }
  }
}
function spellUndo(){ const p=SES.spell.picked.pop(); if(!p)return; p.classList.remove("sel");
  const slots=document.querySelectorAll("#slots .slot"); const s=slots[SES.spell.picked.length]; if(s){s.textContent="";s.classList.remove("fill");} }
function spellHint(){ const need=SES.spell.target[SES.spell.picked.length]; if(!need)return;
  const el=[...document.querySelectorAll("#tileBox .tileL")].find(e=>!e.classList.contains("sel")&&e.textContent.toLowerCase()===need);
  if(el)pickTile(el); }
function spellGiveUp(){ markResult(false); toast("正确拼写："+curWord().w); speak(curWord().w); setTimeout(()=>nextPhase(),1400); }
function doRec(){
  const word=curWord().w;
  const btn=document.getElementById("micBtn"), res=document.getElementById("recRes");
  btn.disabled=true; res.textContent="🎙️ 正在听…请大声读";
  SR.lang="en-US";
  SR.onresult=e=>{
    const said=e.results[0][0].transcript.toLowerCase().replace(/[^a-z'\s]/g,"").trim();
    const target=word.toLowerCase();
    const ok=said.split(/\s+/).includes(target)||said.replace(/\s/g,"")===target.replace(/\s/g,"");
    res.innerHTML=ok?`✅ 听到你读「${esc(said)}」，太棒了！`:`🔁 听到的是「${esc(said)}」，再试试？点 🎙️ 重读`;
    markResult(ok); if(ok)speakPraise(); else speakCheer();
    btn.disabled=false;
  };
  SR.onerror=()=>{ res.textContent="没听清，再点 🎙️ 试一次（注意允许麦克风权限）"; btn.disabled=false; };
  try{SR.start();}catch(e){ btn.disabled=false; }
}
function readSelf(ok){ markResult(ok); if(ok)speakPraise(); else speakCheer(); toast(ok?"真棒！✨":"没关系，加入错词本多练习"); setTimeout(()=>nextWord(),900); }

/* ==================== time tracking ==================== */
setInterval(()=>{ if(!S||!curPid)return; if(document.visibilityState==="visible"){ const d=todayStr(); S.minutes[d]=(S.minutes[d]||0)+0.5; checkTasks(); save(); if(curTab==="ai"&&!document.getElementById("sheet").style.display)render(); } },30000);

/* ==================== 键盘拼写 ==================== */
document.addEventListener("keydown",e=>{
  if(!SES||SES.phases[SES.phase]!=="spell"||!SES.spell)return;
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==="Backspace"){ e.preventDefault(); spellUndo(); return; }
  if(/^[a-zA-Z'-]$/.test(e.key)){
    const el=[...document.querySelectorAll("#tileBox .tileL")].find(t=>!t.classList.contains("sel")&&t.textContent.toLowerCase()===e.key.toLowerCase());
    if(el)pickTile(el);
  }
});

async function enterProfile(id,skipPull){

async function switchProfile(){
  clearTimeout(pushTimer);

}

      document.querySelector("#gateSheet h3").textContent="再输入一次确认";

/* ==================== 云端同步（腾讯云开发 CloudBase） ==================== */
/* 三条设计原则：
   ① 本地 localStorage 永远是「真源」，云端只是同步通道 —— 云服务不可用到期的
      时候，应用照常能学，只是不跨设备。
   ② 每次同步都是「读云端 → 字段级合并 → 写回」，绝不整档覆盖。否则一台设备上
      残留的旧进度会把另一台设备当天的新进度冲掉（真实丢数据场景）。
   ③ API 密钥 S.ai.key 绝不入云。                                              */
const CB_ENV="study-buddy-d2gx2hgoq367da5de";
const CB_COL="progress";
const CB_SDK="https://static.cloudbase.net/cloudbase-js-sdk/2.28.6/cloudbase.full.js";
const CB_MAX_BYTES=520000;         // 单文档体积保护阈值（保守值，云数据库单文档上限待控制台确认）
let CB={ready:false,online:false,uid:null,lastSync:0,lastErr:"",mode:"off"};
let sdkPromise=null, pushTimer=null, syncing=false, pwCtx=null;

/* ---------- SDK 懒加载：不拖慢首屏，离线时优雅降级 ---------- */
function cbLoadSdk(){
  if(window.cloudbase)return Promise.resolve(window.cloudbase);
  if(sdkPromise)return sdkPromise;
  sdkPromise=new Promise(function(res,rej){
    const s=document.createElement("script");
    s.src=CB_SDK; s.async=true;
    let done=false;
    s.onload=function(){ done=true; window.cloudbase?res(window.cloudbase):rej(new Error("SDK 加载后未挂载 cloudbase")); };
    s.onerror=function(){ if(!done)rej(new Error("云端 SDK 下载失败（网络不可用或域名被拦截）")); };
    document.head.appendChild(s);
    setTimeout(function(){ if(!window.cloudbase&&!done)rej(new Error("云端 SDK 加载超时")); },15000);
  });
  sdkPromise.catch(function(){ sdkPromise=null; });   // 失败后允许重试
  return sdkPromise;
}
async function cbInit(){
  if(CB.ready)return true;
  try{
    const cl=await cbLoadSdk();
    const app=cl.init({env:CB_ENV});
    CB.app=app; CB.auth=app.auth; CB.db=app.database();
    CB.ready=true; CB.mode="ready"; CB.lastErr="";
    const s=await cbSession();
    if(s){ CB.online=true; CB.uid=(s.user&&(s.user.id||s.user.uid))||null; CB.mode="signed"; }
    updateSyncChip();
    return true;
  }catch(e){
    CB.ready=false; CB.online=false; CB.mode="fail";
    CB.lastErr=(e&&e.message)?e.message:String(e);
    updateSyncChip();
    return false;
  }
}
/* 登录态由 SDK 自动持久化在 localStorage，刷新后可直接恢复（每台设备只需首次输一次密码） */
async function cbSession(){
  try{
    const r=await CB.auth.getSession();
    return (r&&r.data&&r.data.session)||null;
  }catch(e){ return null; }
}
async function cbLogin(user,pass){
  const ok=await cbInit();
  if(!ok)throw new Error("云服务不可用："+(CB.lastErr||"网络问题"));
  const r=await CB.auth.signInWithPassword({username:user,password:pass});
  if(r&&r.error)throw new Error(r.error.message||"账号或密码不正确");
  let s=(r&&r.data&&r.data.session)||null;
  if(!s)s=await cbSession();
  if(!s)throw new Error("登录已通过，但未取得会话，请重试");
  CB.uid=(s.user&&(s.user.id||s.user.uid))||null;
  CB.online=true; CB.mode="signed"; CB.lastErr="";
  updateSyncChip();
  return CB.uid;
}
async function cbLogout(){
  try{ await CB.auth.signOut(); }catch(e){}
  CB.uid=null; CB.online=false; CB.mode=CB.ready?"ready":"off";
  updateSyncChip();
}

/* ---------- 文档定位：优先用缓存的 _id，失效则按 _openid 查询 ---------- */
function cbIdKey(){ return "emmaCbId_"+(CB.uid||"x"); }
function cbCachedId(){ try{ return localStorage.getItem(cbIdKey()); }catch(e){ return null; } }
function cbCacheId(id){ try{ id?localStorage.setItem(cbIdKey(),id):localStorage.removeItem(cbIdKey()); }catch(e){} }
function cbDocOf(r){
  const d=r&&r.data; if(!d)return null;
  return Array.isArray(d)?(d[0]||null):d;
}
async function cbFetch(){
  if(!CB.ready||!CB.online)return null;
  const cid=cbCachedId();
  if(cid){
    try{
      const d=cbDocOf(await CB.db.collection(CB_COL).doc(cid).get());
      if(d)return d;
    }catch(e){ /* 缓存 _id 失效，落回查询 */ }
    cbCacheId(null);
  }
  const d2=cbDocOf(await CB.db.collection(CB_COL).where({_openid:"{openid}"}).get());
  if(d2&&d2._id)cbCacheId(d2._id);
  return d2||null;
}
async function cbWrite(fields){
  const cid=cbCachedId();
  if(cid){
    try{ await CB.db.collection(CB_COL).doc(cid).update(fields); return true; }
    catch(e){ cbCacheId(null); }        // 文档可能已被删除，落回新建
  }
  const r=await CB.db.collection(CB_COL).add(fields);
  const nid=(r&&(r._id||r.id))||(r&&r.data&&(r.data._id||r.data.id))||null;
  if(nid)cbCacheId(nid);
  return true;
}

/* ---------- 字段级合并（防丢数据的核心） ---------- */
function toCloud(o,pid){
  const c=JSON.parse(JSON.stringify(o));
  delete c.petLine;                       // 宠物闲聊语无同步价值
  if(c.ai)c.ai.key="";                    // 密钥绝不入云
  const p=profileById(pid)||{};
  c.meta={name:p.name||"",avatar:p.avatar||"🧒"};
  return c;
}
function mergeProgress(a,b){
  if(!a)return b;
  if(!b)return a;
  // 偏好类字段（当前教材/宠物/音色/AI 配置）取「时间戳较新的一方」
  const newer=((a._updated||0)>=(b._updated||0))?a:b;
  const out=JSON.parse(JSON.stringify(newer));
  // 累积类字段：一律取并集/最大值，绝不覆盖
  out.xp=Math.max(a.xp||0,b.xp||0);
  out.minutes=out.minutes||{};
  new Set(Object.keys(a.minutes||{}).concat(Object.keys(b.minutes||{}))).forEach(function(d){
    out.minutes[d]=Math.max((a.minutes||{})[d]||0,(b.minutes||{})[d]||0);
  });
  out.books=out.books||{};
  new Set(Object.keys(a.books||{}).concat(Object.keys(b.books||{}))).forEach(function(k){
    const A=(a.books||{})[k]||{}, B=(b.books||{})[k]||{};
    const dst=out.books[k]||{};
    out.books[k]=dst;
    if(!dst.plan)dst.plan=(newer===a?A.plan:B.plan)||null;
    if(!dst.plan)dst.plan={dailyNew:6,startDate:todayStr0()};
    dst.words=dst.words||{};
    new Set(Object.keys(A.words||{}).concat(Object.keys(B.words||{}))).forEach(function(id){
      const x=(A.words||{})[id], y=(B.words||{})[id];
      if(!x){ dst.words[id]=y; return; }
      if(!y){ dst.words[id]=x; return; }
      dst.words[id]={
        learned:!!(x.learned||y.learned),                 // 学过就是学过
        box:Math.max(x.box||0,y.box||0),                  // 掌握程度取更熟练的
        due:(String(x.due||"")>String(y.due||""))?(x.due||""):(y.due||""),   // 复习到期取较晚
        wrong:Math.max(x.wrong||0,y.wrong||0),
        ok:Math.max(x.ok||0,y.ok||0),
        fav:!!(x.fav||y.fav)
      };
    });
    dst.claimed=dst.claimed||{};
    new Set(Object.keys(A.claimed||{}).concat(Object.keys(B.claimed||{}))).forEach(function(k2){
      dst.claimed[k2]=Math.max((A.claimed||{})[k2]||0,(B.claimed||{})[k2]||0);
    });
  });
  out.ai=Object.assign({},newer.ai||{});
  out.ai.key=(a.ai&&a.ai.key)||(b.ai&&b.ai.key)||"";      // 密钥只认本机
  out._updated=Math.max(a._updated||0,b._updated||0);
  return out;
}

/* ---------- 绑定校验：只有「当前档案」绑定的账号 == 当前登录账号时才同步 ---------- */
/* 缺了这道闸，B 孩子在本机进入未绑定的档案时，会把 B 的进度合并进 A 的云端文档 */
function cbBound(){
  const p=profileById(curPid);
  return !!(p&&p.user&&p.uid&&CB.uid&&p.uid===CB.uid);
}

/* ---------- 双向同步：读 → 合并 → 写回（push 与 pull 是同一个操作） ---------- */
async function cbSync(silent){
  if(!curPid||!S){ if(!silent)toast("请先选择一个档案"); return false; }
  if(!CB.ready||!CB.online){
    if(!silent)toast("未登录云账号，进度仅保存在本机");
    return false;
  }
  if(!cbBound()){
    if(!silent)toast("当前档案未绑定云账号，未同步");
    return false;
  }
  if(syncing)return false;
  syncing=true;
  try{
    const doc=await cbFetch();
    const cloud=(doc&&doc.progress)?doc.progress:null;
    const bookBefore=S.book;
    if(cloud)S=mergeProgress(S,cloud);
    // 安全阀：正在上课时不允许同步改掉「当前教材」，否则答题记录会写进另一册的词表里
    if(SES&&S.book!==bookBefore)S.book=bookBefore;
    S._updated=Date.now();
    normalizeState(); loadBookWords();
    localStorage.setItem(DATA_PREFIX+curPid,JSON.stringify(S));
    const body={progress:toCloud(S,curPid),updated:S._updated};
    const size=JSON.stringify(body).length;
    if(size>CB_MAX_BYTES)throw new Error("进度 "+Math.round(size/1024)+"KB 超出单文档保护阈值，本轮未上传");
    await cbWrite(body);
    CB.lastSync=Date.now(); CB.lastErr="";
    syncing=false; updateSyncChip();
    if(!silent)toast("☁️ 同步完成");
    return true;
  }catch(e){
    syncing=false;
    CB.lastErr=(e&&e.message)?e.message:String(e);
    updateSyncChip();
    if(!silent)toast("云同步失败："+CB.lastErr);
    return false;
  }
}
function schedulePush(){
  if(!CB||!CB.ready||!CB.online||!curPid||!cbBound())return;
  clearTimeout(pushTimer);
  pushTimer=setTimeout(function(){ cbSync(true); },4000);   // 4 秒防抖，避免答题过程高频写库
}
async function manualSync(){
  const ok=await cbSync(false);
  if(ok&&curPid)render();
}

}

function gateSyncHtml(){

function updateSyncChip(){
  try{
    const g=document.getElementById("gateSyncLine");
    if(g)g.innerHTML=gateSyncHtml();
    const m=document.getElementById("cbStateLine");
    if(m)m.innerHTML=cbStateHtml();
  }catch(e){}
}
function isGateVisible(){ const g=document.getElementById("gate"); return !!(g&&g.style.display==="block"); }

/* ---------- 云登录界面 ---------- */
function validCbUser(u){
  if(!u||u.length>32)return false;
  if(!/^[A-Za-z0-9_-]+$/.test(u))return false;
  if(/^\d+$/.test(u))return false;                    // 不允许纯数字
  if(/^[-_]/.test(u)||/[-_]$/.test(u))return false;   // - _ 不能在首尾
  return true;
}
function openCloudLogin(preUser,forPid){
  pwCtx={user:preUser||"",forPid:forPid||null};
  drawPwdSheet("登录云账号",preUser||"");
}
function drawPwdSheet(title,user){
  const gs=document.getElementById("gateSheet");
  gs.style.display="block";
  gs.innerHTML='<div class="gsBox">'+
    '<h3>'+esc(title)+'</h3>'+
    '<div class="fRow" style="margin-top:14px"><label>账号（用户名）</label>'+
      '<input id="cbUser" autocomplete="username" autocapitalize="off" spellcheck="false" value="'+esc(user||"")+'" placeholder="例如 emma"></div>'+
    '<div class="fRow"><label>密码</label><div class="pwWrap">'+
      '<input id="cbPass" type="password" autocomplete="current-password" placeholder="8~32 位">'+
      '<button class="eye" type="button" onclick="togglePw()">👁</button></div></div>'+
    '<div class="pinErr" id="pinErr" style="height:auto;min-height:18px"></div>'+
    '<button class="btn3d" onclick="submitCloudLogin()">登录并同步</button>'+
    '<div style="height:9px"></div>'+
    '<button class="btn2" style="width:100%;padding:12px 0" onclick="closeGateSheet()">取消</button>'+
    '<div class="gtip" style="text-align:center;margin-top:14px;font-size:12px;color:#8A7452;line-height:1.75">'+
      '账号由家长在「云开发控制台 → 身份认证 → 用户管理」中创建。<br>'+
      '密码需 8~32 位，且含大写/小写/数字/符号中的 3 类。<br>'+
      '用「Emma2026」这种大小写+数字即可，不必加符号。'+
    '</div></div>';
  setTimeout(function(){
    const e=document.getElementById(pwCtx&&pwCtx.user?"cbPass":"cbUser");
    if(e)e.focus();
  },90);
}
function togglePw(){
  const p=document.getElementById("cbPass");
  if(p)p.type=(p.type==="password"?"text":"password");
}
async function submitCloudLogin(){
  const u=(document.getElementById("cbUser").value||"").trim();
  const p=(document.getElementById("cbPass").value||"");
  const err=document.getElementById("pinErr");
  const btn=document.querySelector("#gateSheet .btn3d");
  if(!validCbUser(u)){ if(err)err.textContent="账号名不合法（1~32 位字母/数字/-/_，不能纯数字）"; return; }
  if(!p){ if(err)err.textContent="请输入密码"; return; }
  if(err)err.textContent="正在连接云端…";
  if(btn){ btn.disabled=true; btn.textContent="连接云端…"; }
  const targetPid=pwCtx?pwCtx.forPid:null;
  try{
    const uid=await cbLogin(u,p);
    let prof=null;
    for(let i=0;i<HUB.profiles.length;i++){ const q=HUB.profiles[i]; if(q.uid&&q.uid===uid){ prof=q; break; } }
    if(!prof){
      let target=targetPid?profileById(targetPid):null;
      if(!target){
        const unbound=HUB.profiles.filter(function(x){ return !x.user; });
        if(unbound.length===1)target=unbound[0];       // 本机只留一个未绑定档案时自动认领
      }
      if(target){ target.user=u; target.uid=uid; }
      else{ const id=newProfileId(); target={id:id,name:u,avatar:"🧒",pin:"",user:u,uid:uid}; HUB.profiles.push(target); }
      saveHub(); prof=target;
    }else if(!prof.user){ prof.user=u; prof.uid=uid; saveHub(); }
    closeGateSheet();
    await enterProfile(prof.id,true);
    await cbSync(true);
    render(); renderGate();
    toast("☁️ 云端同步已开启");
  }catch(e){
    if(err)err.textContent=(e&&e.message)?e.message:"登录失败，请检查账号密码";
    if(btn){ btn.disabled=false; btn.textContent="登录并同步"; }
  }
}
async function cbLogoutFlow(){
  if(!confirm("退出云账号登录？\n\n退出后：本机学习进度仍然保留、可继续使用，但不再自动同步到其他设备。"))return;
  clearTimeout(pushTimer);
  await cbSync(true);            // 尽力先把本机进度送上去，再登出
  await cbLogout();
  toast("已退出云登录");
  if(curPid)render();
  if(isGateVisible())renderGate();
}
function unbindCloud(){
  const p=profileById(curPid); if(!p||!p.user)return;
  if(!confirm("解除「"+p.name+"」与云账号的绑定？\n\n解除后该档案不再同步到云端（云端已有数据不会删除）。"))return;
  p.user=""; p.uid=""; saveHub(); render(); toast("已解除云端绑定");
}

/* ---------- 档案门：已绑云账号走登录，否则走本机 PIN ---------- */
async function tapProfile(id){
  const p=profileById(id); if(!p)return;
  if(p.user){
    const ok=await cbInit();
    if(!ok){ toast("云服务暂不可用，改用本机 PIN"); localPinPath(id); return; }
    const s=await cbSession();
    const uid=s&&s.user&&(s.user.id||s.user.uid);
    if(uid&&p.uid&&uid===p.uid){ enterProfile(id); return; }   // 本机已登录同一账号 → 免密进入
    openCloudLogin(p.user,id);
    return;
  }
  localPinPath(id);
}
function localPinPath(id){
  const p=profileById(id); if(!p)return;
  if(p.pin){ pendingPid=id; pad={mode:"verify",expected:p.pin,buf:"",first:"",onOk:null,title:p.name+" 的 PIN 码"}; drawPad(); }
  else enterProfile(id);
}

/* ==================== boot ==================== */
loadHub();
if(!WORDS_OK){
  showWordsError();                             // 词库缺失：给可见的阻塞提示，别让用户对着「点了没反应」猜
}else{
  showGate();
  cbInit().then(function(){                     // 异步连云端；失败不影响本机使用
    if(isGateVisible())renderGate();
    if(curPid)render();
  });
}

/* 切回前台 → 拉取合并；切后台/离开 → 尽力推送 */
document.addEventListener("visibilitychange",function(){
  if(!curPid||!S)return;
  if(document.visibilityState==="hidden"){ clearTimeout(pushTimer); cbSync(true); }
  else cbSync(true).then(function(ok){ if(ok&&curPid)render(); });
});
window.addEventListener("pagehide",function(){ if(curPid&&S){ clearTimeout(pushTimer); cbSync(true); } });
</script>
